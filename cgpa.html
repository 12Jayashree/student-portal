<!DOCTYPE html>
<html>
<head>

    <style>
        body {
            background-color: #f2f5f9;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            margin-top: 50px;
            box-shadow: 0 3px 10px gray;

        }

        .cgpa {

            color: #198754;

        <a href="index.html" class="btn btn-primary">

    </div>

</div>
